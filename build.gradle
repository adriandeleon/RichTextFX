subprojects {
    apply plugin: 'eclipse'

    // Personal-fork coordinates: distinct from the official org.fxmisc.richtext artifact.
    version = '0.11.7-multicaret.2'
    ext.specificationVersion = '0.11.0'

    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
    }

    if (it.name.equals("richtextfx")) {
        task("getProjectVersion") {
            doLast {
                println version
            }
        }
    }

}
